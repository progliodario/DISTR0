# The Italian layout for the login screen and for every new session.
#
# GDM reads the system keyboard layout from systemd-localed, not from
# /etc/vconsole.conf's KEYMAP nor from any user's dconf: without this file the
# password on the login screen is typed on a US layout. This is the file
# `localectl set-x11-keymap it` writes; XKBLAYOUT in /etc/vconsole.conf carries
# the same value for the newer localed code path. Change it with localectl.
Section "InputClass"
        Identifier "system-keyboard"
        MatchIsKeyboard "on"
        Option "XkbLayout" "it"
EndSection
