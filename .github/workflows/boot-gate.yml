---
# A container build cannot show GDM starting or the desktop reading a dconf
# database: that needs a systemd boot. The build already runs this gate on the
# image it built, before publishing; this workflow runs it again on the image
# as the registry serves it, pulled by tag and held to the commit it was built
# from. It waits for the login screen, screenshots the framebuffer and runs
# scripts/boot-gate-checks.sh inside the guest. `docs/claims.md` maps each
# promise to the check that proves it.
name: Boot the published image

on:
  workflow_run:
    workflows: ["Build container image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image:
        description: Image reference to boot
        required: false
        default: ghcr.io/progliodario/distr0:latest

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

env:
  IMAGE: ${{ github.event.inputs.image || 'ghcr.io/progliodario/distr0:latest' }}
  # Set for workflow_run, empty for a manual dispatch. The gate refuses an image
  # whose OCI revision label does not match, so a run can never report on a
  # different commit than the one it checked out.
  EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha || '' }}

jobs:
  boot:
    name: Boot to the login screen
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    # The gate pulls the container image and installs it to a disk before it
    # can boot: a slow runner makes the minutes before the boot unpredictable.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install QEMU
        run: |
          set -xeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            ovmf
          qemu-system-x86_64 --version

      - name: Enable KVM
        run: |
          set -xeuo pipefail
          # The runner user cannot join the kvm group mid-job and the device is
          # root:kvm 0660, so QEMU would silently fall back to TCG and never
          # reach a desktop. The udev rule is GitHub's documented way to expose
          # it; without /dev/kvm the gate must fail here, not 40 minutes later.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Boot the image and check the running system
        run: |
          set -xeuo pipefail
          args=(--image "${IMAGE}" --require-kvm)
          if [[ -n "${EXPECTED_REVISION}" ]]; then
            args+=(--expect-revision "${EXPECTED_REVISION}")
          fi
          # The wrapper streams each phase as a notice and annotates every
          # failed check, so a red run says why without the job log.
          scripts/boot-gate-ci.sh "${RUNNER_TEMP}/boot-gate" "${args[@]}"

      - name: Upload the login screen and the log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-gate
          path: |
            ${{ runner.temp }}/boot-gate/login-screen.png
            ${{ runner.temp }}/boot-gate/login-screen.ppm
            ${{ runner.temp }}/boot-gate/boot-gate.log
            ${{ runner.temp }}/boot-gate/guest-report.log
            ${{ runner.temp }}/boot-gate/pull.log
            ${{ runner.temp }}/boot-gate/install.log
            ${{ runner.temp }}/boot-gate/qemu.log
            ${{ runner.temp }}/boot-gate/console.log
            ${{ runner.temp }}/boot-gate/qmp.log
          if-no-files-found: warn
          retention-days: 7
