---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    # Weekly: the base image is pinned by digest, so a rebuild only republishes
    # the same content. Pushing a changed pin still builds immediately.
    - cron: '05 10 * * 1'  # 10:05am UTC every Monday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_DESC: "DISTR0 - a custom bootc image built on Bluefin (Universal Blue)"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"  # Put your own image here for a fancy profile on https://artifacthub.io/!
  IMAGE_NAME: "${{ github.event.repository.name }}"  # output image name, usually same as repo name
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04

    # Push, sign and attest need the package; nothing here writes to the
    # repository, and signing uses the key, not an OIDC token.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # This is optional, but if you see that your builds are way too big for the runners, you can enable this by uncommenting the following lines:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      # Authenticated pulls are not subject to anonymous throttling, and the
      # pinned base is the one pull that can fail before any of this repository's
      # code runs. Pulling it here gives the retry, and gives a failure a name.
      - name: Log in to GHCR for the base image
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
      # which rootless buildah/podman need: without this, pulls and builds fail
      # with "Error during unshare(...): Operation not permitted".
      - name: Allow rootless containers
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Best effort: it warms the storage with the retries buildah lacks, but the
      # build pulls the base itself if this does not work, so a registry hiccup
      # here must not decide the build.
      - name: Pull the pinned base image
        continue-on-error: true
        run: |
          set -xeuo pipefail
          df -h /
          base="$(awk '/^FROM ghcr\.io\/ublue-os\/bluefin/{print $2}' Containerfile | head -n1)"
          ref="ghcr.io/ublue-os/bluefin@${base#*@}"
          echo "base=${base}"
          echo "ref=${ref}"

          for attempt in 1 2 3 4 5; do
            if output="$(podman pull "${ref}" 2>&1)"; then
              echo "${output}"
              exit 0
            fi
            echo "attempt ${attempt} failed:"
            echo "${output}"
            sleep 10
          done

          echo "::error title=Base image pull::${ref} | $(printf '%s' "${output}" | tail -n 4 | tr '\n' ' ' | cut -c1-800)"
          exit 1

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT
          # The same day, as build.sh writes it into IMAGE_VERSION.
          echo "day=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

      # Image metadata for https://artifacthub.io/ - This is optional but is highly recommended so we all can get a index of all the custom images
      # The metadata by itself is not going to do anything, you choose if you want your image to be on ArtifactHub or not.
      - name: Image Metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: metadata
        with:
          # This generates all the tags for your image, you can add custom tags here too!
          # Default tags are "$DEFAULT_TAG" and "$DEFAULT_TAG.$date".
          # Only the tags that are actually published. A pull request builds and
          # tests the image but never pushes it (see the `if` on the push step),
          # so a `sha-…` or `pr-…` tag would name something that does not exist.
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      # Keep the manifest of the image that is published right now, so the build
      # can report what an update will actually download. Manifest only: no pull.
      - name: Remember the published image
        id: previous
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -xeuo pipefail
          if ! command -v skopeo > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi
          manifest="${RUNNER_TEMP}/previous-manifest.json"
          if ! skopeo inspect --raw \
                 "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}" > "${manifest}" 2> /dev/null; then
            echo '{}' > "${manifest}"
            echo "No published image yet, there is nothing to compare against."
          fi
          echo "manifest=${manifest}" >> "${GITHUB_OUTPUT}"

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          containerfiles: |
            ./Containerfile
          # Postfix image name with -custom to make it a little more descriptive
          # Syntax: https://docs.github.com/en/actions/learn-github-actions/expressions#format
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            DISTR0_BUILD_DATE=${{ steps.date.outputs.day }}
            DISTR0_REVISION=${{ github.sha }}
          oci: false

      # The image carries its own test. Static lint cannot tell whether the
      # overlay, the policy merge or the declarations actually landed.
      - name: Run the image self-test
        run: |
          set -xeuo pipefail
          report="${RUNNER_TEMP}/selftest.log"
          if podman run --rm "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
               /usr/share/distr0/selftest.sh > "${report}" 2>&1; then
            cat "${report}"
            exit 0
          fi
          cat "${report}"
          # One annotation per failed check: the job log needs permissions the
          # repository's own automation may not have, annotations do not.
          while IFS= read -r line; do
            case "${line}" in
              FAIL*) echo "::error title=DISTR0 self-test::${line}" ;;
            esac
          done < "${report}"
          exit 1

      # Rechunk: rebuild the image with many small layers instead of one big
      # build layer, so that `bootc upgrade` only downloads what actually
      # changed. Same command as `just rechunk` locally (chunkah, pinned by
      # digest; multi-arch index, so amd64 and arm64 both resolve).
      - name: Rechunk image
        id: rechunk
        run: |
          set -xeuo pipefail
          IMAGE="localhost/${IMAGE_NAME}:${DEFAULT_TAG}"
          OUTPUT_DIR="$(mktemp -d "${PWD}/_chunkah_XXXXXX")"
          CONFIG_FILE="$(mktemp)"
          trap 'rm -f "${CONFIG_FILE}"' EXIT

          podman inspect "${IMAGE}" > "${CONFIG_FILE}"

          podman run --rm \
            --mount=type=image,src="${IMAGE}",target=/chunkah \
            -v "${CONFIG_FILE}:/chunkah-config.json:ro,Z" \
            -v "${OUTPUT_DIR}:/run/out:Z" \
            quay.io/coreos/chunkah@sha256:71e593421c5de7dcc7c8c5c50e98d3bac572055a76f399f61a491d123c20a523 \
            build \
            --verbose \
            --compressed \
            --max-layers 128 \
            --prune /sysroot/ \
            --label ostree.commit- \
            --label ostree.final-diffid- \
            --config /chunkah-config.json \
            --output oci:/run/out/chunked

          CHUNKED_IMAGE="$(podman pull "oci:${OUTPUT_DIR}/chunked")"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            podman tag "${CHUNKED_IMAGE}" "localhost/${IMAGE_NAME}:${tag}"
          done
          # The boot gate installs with root's podman: give it the very image
          # that will be pushed, not a copy of the unchunked build.
          ROOT_IMAGE="$(sudo podman pull "oci:${OUTPUT_DIR}/chunked")"
          sudo podman tag "${ROOT_IMAGE}" "localhost/${IMAGE_NAME}:${DEFAULT_TAG}"
          sudo rm -rf "${OUTPUT_DIR}"

      # Nothing is published until this image has booted: the boot gate installs
      # it to a disk, boots it with KVM, and runs the in-guest checks against
      # this commit. On a pull request it tests the change before it is merged.
      - name: Install QEMU for the boot gate
        run: |
          set -xeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
          qemu-system-x86_64 --version

      - name: Enable KVM for the boot gate
        run: |
          set -xeuo pipefail
          # The runner user cannot join the kvm group mid-job and the device is
          # root:kvm 0660; this udev rule is GitHub's documented way to open it.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Boot the image before publishing it
        run: |
          set -xeuo pipefail
          scripts/boot-gate-ci.sh "${RUNNER_TEMP}/boot-gate" \
            --local "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            --expect-revision "${GITHUB_SHA}" \
            --require-kvm
          # The gate's disk is not needed any more, and the push needs room.
          sudo rm -rf "${RUNNER_TEMP}/boot-gate/output"
          sudo podman rmi -f "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" || true

      - name: Upload the boot gate's screenshot and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-gate-build
          path: |
            ${{ runner.temp }}/boot-gate/login-screen.png
            ${{ runner.temp }}/boot-gate/boot-gate.log
            ${{ runner.temp }}/boot-gate/guest-report.log
            ${{ runner.temp }}/boot-gate/install.log
            ${{ runner.temp }}/boot-gate/qemu.log
            ${{ runner.temp }}/boot-gate/console.log
          if-no-files-found: warn
          retention-days: 7

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      # An SBOM of the exact image that was pushed, from the local image so no
      # registry round-trip can produce a different answer.
      - name: Generate SBOM (syft, pinned by digest)
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -xeuo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT
          podman save --format oci-dir -o "${work}/image" \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}"
          podman run --rm -v "${work}:/work:Z" -w /work \
            ghcr.io/anchore/syft@sha256:e97e20b6e6d1699c60296b66ab337941724f9bd06ac279d893eda89601fc4b2a \
            scan "oci-dir:/work/image" -o spdx-json=/work/sbom.spdx.json
          cp "${work}/sbom.spdx.json" sbom-full.spdx.json

          # The attestation exists to answer "is this package in the image?", and
          # cosign refuses to attach a layer over ~100 MB. syft's SPDX output also
          # carries a hash of every file in the OS (105 MB here), so keep the
          # packages and their relationships, drop the file inventory.
          cat > "${work}/trim.jq" <<'JQ'
          del(.files)
          | .packages = [(.packages // [])[] | del(.hasFiles)]
          | .relationships = [((.relationships // [])[])
              | select((((.spdxElementId // "") | startswith("SPDXRef-File")) | not)
                       and ((((.relatedSpdxElement // "") | startswith("SPDXRef-File")) | not)))]
          JQ
          jq -c -f "${work}/trim.jq" sbom-full.spdx.json > sbom.spdx.json
          rm -f sbom-full.spdx.json
          jq -r '.packages | length' sbom.spdx.json | xargs -I{} echo "SBOM lists {} packages"
          du -h sbom.spdx.json

      # Which known vulnerabilities the published packages carry, from the SBOM
      # just made: a report on the run summary, not a gate. Most fixes arrive
      # with the next Bluefin base bump, so this is what tells when one is due.
      - name: Report known vulnerabilities (grype, pinned by digest)
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        run: |
          set -xeuo pipefail
          podman run --rm -v "${PWD}:/work:Z" -w /work \
            ghcr.io/anchore/grype@sha256:661583704a253c0448ed63998b5ea2cd9d5a76ee71eedc4aed439b8ce3e93a1c \
            sbom:/work/sbom.spdx.json -o json=/work/grype.json
          {
            echo '### Known vulnerabilities in the published packages'
            echo
            echo '| Severity | Count | With a fix available |'
            echo '| --- | --- | --- |'
            jq -r '
              [.matches[] | {s: .vulnerability.severity, fixed: (.vulnerability.fix.state == "fixed")}]
              | group_by(.s)[]
              | "| \(.[0].s) | \(length) | \(map(select(.fixed)) | length) |"
            ' grype.json
            echo
            echo 'Critical and high with a fix:'
            echo
            jq -r '
              [.matches[]
               | select((.vulnerability.severity == "Critical" or .vulnerability.severity == "High")
                        and .vulnerability.fix.state == "fixed")
               | "- \(.vulnerability.id) in \(.artifact.name) \(.artifact.version) (fixed in \(.vulnerability.fix.versions | join(", ")))"]
              | unique | .[:25][]
            ' grype.json
          } >> "${GITHUB_STEP_SUMMARY}"
          rm -f grype.json

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v2.6.3'

      # Signed by digest: every tag names the same manifest, a signature is
      # stored per digest, and signing a tag could sign whatever the tag points
      # at by then. cosign stays on v2, whose default is the `.sig` attachment
      # containers/image (bootc, podman, skopeo) reads; cosign v3 writes a
      # bundle they cannot see unless signing passes --new-bundle-format=false
      # (scripts/validate.py enforces that if the version is ever raised).
      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -xeuo pipefail
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          DIGEST="${{ steps.push.outputs.digest }}"
          [[ "${DIGEST}" == sha256:* ]] || { echo "::error::the push reported no digest"; exit 1; }
          # No transparency-log upload: the devices verify this signature against
          # the key in /etc/containers/policy.json, which does not consult Rekor,
          # so a public service being down must not decide whether a build ships.
          cosign sign -y --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "${IMAGE_FULL}@${DIGEST}"
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

      # The check bootc performs on every device, made here and now instead of
      # a week later in verify-image.yml: the signature verifies with the shipped
      # key, and it sits where containers/image looks for it, as the
      # `sha256-<digest>.sig` simple-signing attachment. A cosign that wrote any
      # other format would fail here, before a single machine refused an update.
      - name: The signature is one bootc can verify
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -xeuo pipefail
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          DIGEST="${{ steps.push.outputs.digest }}"
          cosign verify --key ./cosign.pub --insecure-ignore-tlog "${IMAGE_FULL}@${DIGEST}" > /dev/null
          # One signature covers every tag only if every tag names this digest.
          for tag in ${{ steps.metadata.outputs.tags }}; do
            tagged="$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE_FULL}:${tag}")"
            if [[ "${tagged}" != "${DIGEST}" ]]; then
              echo "::error title=Signature coverage::${tag} is ${tagged}, the signed digest is ${DIGEST}"
              exit 1
            fi
          done
          attachment="${IMAGE_FULL}:${DIGEST/:/-}.sig"
          media="$(skopeo inspect --raw "docker://${attachment}" | jq -r '.layers[0].mediaType')"
          if [[ "${media}" != application/vnd.dev.cosign.simplesigning.v1+json ]]; then
            echo "::error title=Signature format::${attachment} holds '${media}', which containers/image cannot verify"
            exit 1
          fi
          echo "Signed as ${attachment} (${media})."

      # The SBOM is signed by the same key as the image, so `verify-image.yml`
      # can check that the inventory belongs to the image it describes.
      - name: Attest the SBOM
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -xeuo pipefail
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          # By digest, like the signature: an attestation is stored per digest.
          ls -lh sbom.spdx.json
          # Same reasoning as the signature: key-based verification on the device,
          # no Rekor dependency in the build.
          if ! output="$(cosign attest -y --tlog-upload=false --key env://COSIGN_PRIVATE_KEY \
                 --type spdxjson --predicate sbom.spdx.json "${IMAGE_FULL}@${{ steps.push.outputs.digest }}" 2>&1)"; then
            echo "${output}"
            echo "::error title=SBOM attestation::$(printf '%s' "${output}" | tail -n 4 | tr '\n' ' ' | cut -c1-800) | sbom $(du -h sbom.spdx.json | cut -f1)"
            exit 1
          fi
          echo "${output}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

      # What an existing installation will download to get this build. Written to
      # the run summary; the README quotes numbers measured this way.
      - name: Measure layer reuse
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -xeuo pipefail
          current="${RUNNER_TEMP}/current-manifest.json"
          skopeo inspect --raw "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}" > "${current}"
          if [[ "$(cat "${{ steps.previous.outputs.manifest }}")" == '{}' ]]; then
            echo 'No previous image: this is the first build.' >> "${GITHUB_STEP_SUMMARY}"
          else
            python3 scripts/layer-diff.py \
              "${{ steps.previous.outputs.manifest }}" "${current}" \
              --summary "${GITHUB_STEP_SUMMARY}"
          fi
