---
# Fast checks that never build the image. Recipes, shell scripts, the
# Containerfile and the settings duplicated across files (pins, policies,
# declared apps) are verified in about a minute, so a mistake shows up here
# instead of ten minutes later inside a full image build.
name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JUST_VERSION: "1.59.0"
  PYYAML_VERSION: "6.0.3"
  PYTEST_VERSION: "9.2.0"
  HADOLINT_VERSION: "2.15.1"
  HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
  ACTIONLINT_VERSION: "1.7.9"
  ACTIONLINT_SHA256: "233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4"

jobs:
  lint:
    name: Lint configuration
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install validators
        # A venv rather than `pip install --user`: Ubuntu marks its system Python
        # as externally managed. Its bin/ goes first in PATH so both `just` and
        # `python3` (with PyYAML) are the pinned ones for the later steps.
        run: |
          set -xeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          python3 -m venv "${RUNNER_TEMP}/tools"
          "${RUNNER_TEMP}/tools/bin/pip" install --disable-pip-version-check --quiet \
            "rust-just==${JUST_VERSION}" "pyyaml==${PYYAML_VERSION}" "pytest==${PYTEST_VERSION}"
          echo "${RUNNER_TEMP}/tools/bin" >> "${GITHUB_PATH}"
          curl -fsSL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  /tmp/hadolint" | sha256sum -c -
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint

      # `just lint` skips actionlint, hadolint and the YAML checks when they are
      # missing, which is right on a desktop and wrong in CI: a green job would
      # not prove they ran. Fail loudly here instead.
      - name: Every validator is available
        run: |
          set -xeuo pipefail
          just --version
          shellcheck --version
          hadolint --version
          actionlint --version
          python3 -c 'import yaml; print("pyyaml", yaml.__version__)'

      - name: Just recipes are formatted
        run: just check

      - name: Configuration is consistent
        run: just lint

      # The checker and the gate's helpers have their own tests; without this
      # step they only ran on a contributor's machine, if at all.
      - name: Unit tests
        run: just test-unit
